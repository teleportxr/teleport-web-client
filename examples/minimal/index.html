<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teleport web client — minimal example</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #ddd;
        font: 14px/1.4 system-ui, sans-serif;
      }
      header {
        padding: 8px 12px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      header input {
        flex: 1;
        padding: 6px 8px;
        background: #222;
        color: #eee;
        border: 1px solid #444;
        border-radius: 4px;
      }
      teleport-viewer {
        display: block;
        width: 100%;
        height: calc(100% - 48px);
      }
    </style>
  </head>
  <body>
    <header>
      <label for="src">Server</label>
      <input
        id="src"
        type="text"
        value="teleport://localhost:8081"
        spellcheck="false"
      />
      <button id="connect">Connect</button>
      <button id="disconnect">Disconnect</button>
    </header>
    <teleport-viewer id="viewer"></teleport-viewer>
    <script type="module">
      import "../../src/index.ts";
      const viewer = document.getElementById("viewer");
      const src = document.getElementById("src");
      document.getElementById("connect").addEventListener("click", () => {
        viewer.setAttribute("src", src.value);
        viewer.connect();
      });
      document.getElementById("disconnect").addEventListener("click", () => {
        viewer.disconnectClient();
      });
      viewer.addEventListener("state", (e) => {
        console.log("state:", e.detail);
      });
      viewer.addEventListener("command", (e) => {
        console.log("command:", e.detail);
      });
      viewer.addEventListener("error", (e) => {
        console.error("error:", e.detail);
      });
    </script>
  </body>
</html>
